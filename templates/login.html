{% extends 'base.html' %}
{% block title %}{% endblock %}
{% block content %}

<div style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div style="background: white; border: 1px solid #d0dce8; border-radius: 16px; padding: 3rem 2.5rem; width: 100%; max-width: 420px; box-shadow: 0 4px 24px rgba(27,42,74,0.10);">

        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 48px; margin-bottom: 0.75rem;">✈</div>
            <h1 style="font-size: 24px; font-weight: 600; color: #1b2a4a; margin-bottom: 0.25rem;">Welcome back</h1>
            <p style="font-size: 14px; color: #6b7c93;">Sign in to AirManager</p>
        </div>

        <form id="form" action="/chklogin" method="post">
            <div style="margin-bottom: 1.25rem;">
                <label for="user">Username</label>
                <input type="text" id="user" name="user" value="{{ user }}" placeholder="Enter your username"/>
            </div>

            <div style="margin-bottom: 1.75rem;">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" value="{{ password }}" placeholder="Enter your password"/>
            </div>

            <button type="submit" style="width: 100%; padding: 11px; background: #2e6fbd; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 500; font-family: 'Inter', sans-serif; cursor: pointer; transition: background 0.15s;">
                Sign in
            </button>
        </form>

        {% if resul %}
        <p style="margin-top: 1.25rem; text-align: center; font-size: 13px; font-weight: 500; color: #c0392b;">
            {{ resul }}
        </p>
        {% endif %}

    </div>
</div>

{% endblock %}
